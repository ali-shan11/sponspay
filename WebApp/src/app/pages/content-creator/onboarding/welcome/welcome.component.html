<div class="d-flex gap-4 justify-content-center onboard-wrapper-images">
    <img class="welcome-img" src="svg/content-creator/welcome-icon.svg" alt="Connect Youtube">
</div>
<div class="title-wrapper mt-4 pt-4">
    <div class="text-medium text-center">Welcome to SponsPay 🎉</div>
    <div class="text-regular text-center mt-3">Your account is all set up! Head to your dashboard to share your unique
        payment link and start earning from your global audience.</div>
</div>

<div class="mt-3 pt-3 mt-lg-5 pt-lg-3">
    <app-button btnText="Go To Dashboard" [iconUrl]="svgIcons.arrowRightIcon" (btnClick)="goToDashboard()"
        data-cy="go-to-dashboard"></app-button>
</div>
