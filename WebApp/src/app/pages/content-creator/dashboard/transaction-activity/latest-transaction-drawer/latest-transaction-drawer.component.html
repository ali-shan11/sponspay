<div
  #offcanvasEl
  class="offcanvas offcanvas-end custom-modal"
  tabindex="-1"
  id="rightModal"
  aria-labelledby="rightModalLabel"
>
  <div class="offcanvas-header p-0">
  </div>
  <div class="offcanvas-body">
    @if (CurrentData) {
        <div class="content-wrapper d-flex flex-column gap-2 justify-content-between min-h-100 h-100">
            <div>
                <div class="user-country-wrapper">
                    <div class="actions d-flex justify-content-between">
                        <button class="btn cursor-pointer p-0 border-0" (click)="closeDrawer()">
                            <img src="svg/menu/sidebar-sponspay-close.svg" alt="close">
                        </button>
                        <div class="move-actions">
                            <div class="left action" role="presentation" [class.disabled]="selectedOption===0" (click)="goLeft()">
                                <app-inline-svg [src]="svgIcons.arrowLeftIcon"></app-inline-svg>
                            </div>
                            <div class="right action" role="presentation" [class.disabled]="selectedOption===data.length-1" (click)="goRight()">
                                <app-inline-svg [src]="svgIcons.arrowRightIcon"></app-inline-svg>
                            </div>
                        </div>
                    </div>
                    <div class="flag-wrapper text-center">
                        <img class="icon" [src]="CurrentData.flag" alt="flag">
                        <div class="name">{{CurrentData.country}}</div>
                    </div>
                    <div class="shield-user-wrapper d-flex justify-content-center">
                        <div class="shield-user d-flex gap-2">
                            <img src="svg/content-creator/dashboard/shield-user.svg" alt="user">
                            <div class="name">Kwame Boateng</div>
                        </div>
                    </div>
                    @if (!CurrentData.replyDeadline) {
                        <div class="configuration-status d-flex justify-content-center gap-2">
                            <app-inline-svg src="svg/check-filled.svg" ></app-inline-svg>
                            <div class="align-self-center">Compensation Configured</div>
                        </div>    
                    }@else {
                        <div class="d-flex justify-content-center">
                            <div class="drawer-pending compensation-card">
                                <app-inline-svg src="svg/plus.svg"></app-inline-svg>
                                <div class="align-self-center">Configure</div>
                            </div>
                        </div>
                    }
                </div>
                <div class="payout-view-btn d-flex gap-2 mt-3">
                    <app-button class="general w-100" btnText="General Details" iconUrl="svg/content-creator/dashboard/general.svg" iconPlacement="before" [type]="paymentStep===2?'secondary':'primary'" (btnClick)="paymentStep=1" ></app-button>
                    <app-button class="payout w-100" btnText="Payout Statements" iconUrl="svg/content-creator/dashboard/payout.svg" iconPlacement="before" [type]="paymentStep===1?'secondary':'primary'" (btnClick)="paymentStep=2" ></app-button>
                </div>
