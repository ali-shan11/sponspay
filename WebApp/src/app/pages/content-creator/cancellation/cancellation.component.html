<div class=" pb-4">
    <div class="row justify-content-center onboard-wrapper px-3 px-md-4 px-lg-0 m-0">
        @switch (currentStep) {
            @case (0) {
                <div class="col-11 col-md-10 col-lg-5 p-1 mt-3">
                    <div class="onboard-card bg-white">
                         <app-confirm-cancellation (reasonChange)="handleReasonChange($event)"></app-confirm-cancellation>
                    </div>
                    <div class="d-flex mt-4 gap-4">
                        <app-button class="w-100" btnText="No, go back" [iconUrl]="svgIcon.arrowLeftIcon" [iconPlacement]="'before'" (btnClick)="onBackClick()" type="secondary" data-cy="cancel-back-btn" ></app-button>
                        <app-button class="w-100" btnText="Continue" [iconUrl]="svgIcon.arrowRightIcon" [disabled]="!reason.trim()" (btnClick)="cancel()" data-cy="cancel-continue-btn" ></app-button>
                    </div>
                </div>
            }
            @case (1) {
                <div class="col-11 col-md-10 col-lg-4 p-1 mt-3">
                    <div class="onboard-card welcome-bg bg-white">
                        <app-thank-you></app-thank-you>
                    </div>
                </div>
            }
        }
    </div>
</div>
