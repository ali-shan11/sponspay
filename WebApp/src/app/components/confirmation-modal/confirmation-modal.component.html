<!-- fullscreen below md, centered above -->
<div #modal class="custom-modal modal fade modal-fullscreen-md-down">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="d-flex d-md-none modal-header">
            <img class="title-image" [src]="modalIcon[modalType]" alt="Confirmation Modal">
            <button class="btn close-icon p-0 m-0 border-0" (click)="close()">
                <img src="svg/content-creator/compensation/close.svg" alt="close">
            </button>
        </div>

        <div class="modal-body pb-3">
        </div>

        <div class="modal-footer p-3">
            <div class="d-flex gap-2 w-100">
                <app-button class="w-100" btnText="Cancel" type="secondary" (btnClick)="close()" ></app-button>
                <app-button class="w-100" btnText="Confirm" (click)="onConfirmClick()" ></app-button>
            </div>
        </div>
    </div>
  </div>
</div>
