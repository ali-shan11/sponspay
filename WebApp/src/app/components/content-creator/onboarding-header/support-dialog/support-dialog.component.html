<div #modal class="custom-modal modal fade modal-fullscreen-sm-down">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body">
                <button class="btn close-icon cursor-pointer p-0 border-0" (click)="close()">
                    <img src="svg/menu/sidebar-sponspay-close.svg" alt="close">
                </button>

                <div class="content-wrapper text-center">
                    <div class="icon-wrapper">
                        <img src="svg/content-creator/help.svg" alt="Support">
                    </div>
                    <h2 class="title">Need Help?</h2>
                    <p class="subtitle">Our support team is here to help you through the onboarding process.</p>

                    <div class="contact-cards">
                        <a href="mailto:customersupport&#64;sponspay.com" class="contact-card">
                            <div class="contact-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                </svg>
                            </div>
                            <div class="contact-details">
                                <div class="contact-label">Email us</div>
                                <div class="contact-value">customersupport&#64;sponspay.com</div>
                            </div>
                        </a>

                        <a href="tel:+15719691754" class="contact-card">
                            <div class="contact-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                                </svg>
                            </div>
                            <div class="contact-details">
                                <div class="contact-label">Call us</div>
                                <div class="contact-value">+1 (571) 969-1754</div>
                            </div>
                        </a>
                    </div>

                    <p class="hours">Available Monday - Friday, 9am - 5pm EST</p>

                    <button class="btn cta-btn" (click)="close()">Got it</button>
                </div>
            </div>
        </div>
    </div>
</div>
