<div class="header-main">
    <div class="header-wrapper d-flex justify-content-between">
        <div class="logo">
            <img role="presentation" [src]="svgIcon.logoDark" alt="Logo" (click)="goHome()" >
        </div>
        <div class="d-flex gap-3">
            <!-- <img class="cursor-pointer align-self-center" [src]="svgIcon.notification" alt="notification" [width]="24"> -->
            <img class="cursor-pointer align-self-center" [src]="svgIcon.help" alt="help" [width]="24" tabindex="0" role="button" (click)="isSupportOpen=true" (keydown.enter)="isSupportOpen=true">
        </div>
    </div>
</div>

@if (isSupportOpen) {
    <app-support-dialog (closed)="isSupportOpen=false"></app-support-dialog>
}
