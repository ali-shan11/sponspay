apiVersion: apps/v1
kind: Deployment
metadata:
  name: sponspay-webapp
  labels:
    app: sponspay-webapp
    component: frontend
spec:
  selector:
    matchLabels:
      app: sponspay-webapp
  template:
    metadata:
      labels:
        app: sponspay-webapp
        component: frontend
    spec:
      containers:
      - name: sponspay-webapp
        image: us-east1-docker.pkg.dev/sponspay-deployment/sponspay-dev/webapp
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 100m
            ephemeral-storage: 1Gi
            memory: 256Mi
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
