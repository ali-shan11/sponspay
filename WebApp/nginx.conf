worker_processes  1;

events {
    worker_connections  1024;
}

http {
    server {
        listen 80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        # Hashed static assets are content-addressed — safe to cache forever.
        # Must come before `location /` so the regex match wins for these extensions.
        location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Everything else — including index.html and SPA route fallbacks — must
        # never be cached, so users always pick up the latest hashed bundle names.
        location / {
            add_header Cache-Control "no-store, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }

        # Firebase auth: reverse proxy for signin-helpers for popup/redirect sign in.
        # if changing below, fix environment.ts
        # Implementation of Option 3: https://firebase.google.com/docs/auth/web/redirect-best-practices
        # `^~` prevents the static-asset regex location above from hijacking
        # Firebase's /__/auth/*.js handler assets and returning 404.
        location ^~ /__/auth {
            proxy_pass https://sponspay-fassil.firebaseapp.com;
        }
    }
}