<svg width="180" height="150" viewBox="0 0 180 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="90" cy="65" r="50" fill="#F0F4FF"/>

  <!-- Globe -->
  <circle cx="90" cy="65" r="30" fill="white" stroke="#D4DDEF" stroke-width="1.5"/>
  <ellipse cx="90" cy="65" rx="12" ry="30" fill="none" stroke="#E8EDFB" stroke-width="1.2"/>
  <line x1="60" y1="65" x2="120" y2="65" stroke="#E8EDFB" stroke-width="1.2"/>
  <line x1="63" y1="50" x2="117" y2="50" stroke="#EDF0F7" stroke-width="1"/>
  <line x1="63" y1="80" x2="117" y2="80" stroke="#EDF0F7" stroke-width="1"/>

  <!-- Location pins (faded) -->
  <g opacity="0.4">
    <!-- Pin 1 -->
    <path d="M72 48 C72 44.7 74.7 42 78 42 C81.3 42 84 44.7 84 48 C84 52 78 57 78 57 C78 57 72 52 72 48Z" fill="#3863FF" opacity="0.3"/>
    <circle cx="78" cy="48" r="2" fill="white"/>
  </g>
  <g opacity="0.3">
    <!-- Pin 2 -->
    <path d="M98 55 C98 51.7 100.7 49 104 49 C107.3 49 110 51.7 110 55 C110 59 104 64 104 64 C104 64 98 59 98 55Z" fill="#3863FF" opacity="0.3"/>
    <circle cx="104" cy="55" r="2" fill="white"/>
  </g>
  <g opacity="0.2">
    <!-- Pin 3 -->
    <path d="M80 72 C80 68.7 82.7 66 86 66 C89.3 66 92 68.7 92 72 C92 76 86 81 86 81 C86 81 80 76 80 72Z" fill="#3863FF" opacity="0.3"/>
    <circle cx="86" cy="72" r="2" fill="white"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="40" cy="45" r="3" fill="#E8EDFB"/>
  <circle cx="145" cy="80" r="4" fill="#E8EDFB"/>
  <circle cx="38" cy="85" r="2.5" fill="#F0F4FF"/>

  <!-- Dollar badge -->
  <circle cx="125" cy="42" r="10" fill="#F0F4FF" stroke="#D4DDEF" stroke-width="1"/>
  <text x="125" y="46" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#C5CEE0">$</text>

  <!-- Text -->
  <text x="90" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#84818A">No countries yet</text>
  <text x="90" y="145" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#ADAFB9">Top earning countries will appear here</text>
</svg>
