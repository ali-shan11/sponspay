<svg width="140" height="130" viewBox="0 0 140 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="70" cy="42" r="34" fill="#F0F4FF"/>

  <!-- Globe -->
  <circle cx="70" cy="42" r="22" fill="white" stroke="#D4DDEF" stroke-width="1.2"/>
  <ellipse cx="70" cy="42" rx="9" ry="22" fill="none" stroke="#E8EDFB" stroke-width="1"/>
  <line x1="48" y1="42" x2="92" y2="42" stroke="#E8EDFB" stroke-width="1"/>
  <line x1="51" y1="30" x2="89" y2="30" stroke="#EDF0F7" stroke-width="0.8"/>
  <line x1="51" y1="54" x2="89" y2="54" stroke="#EDF0F7" stroke-width="0.8"/>

  <!-- Location pin (faded) -->
  <g opacity="0.35">
    <path d="M82 30 C82 27 84.5 25 87 25 C89.5 25 92 27 92 30 C92 34 87 38 87 38 C87 38 82 34 82 30Z" fill="#3863FF" opacity="0.4"/>
    <circle cx="87" cy="30" r="1.5" fill="white"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="32" cy="32" r="2.5" fill="#E8EDFB"/>
  <circle cx="112" cy="52" r="3" fill="#E8EDFB"/>

  <!-- Dollar badge -->
  <circle cx="98" cy="24" r="8" fill="#F0F4FF" stroke="#D4DDEF" stroke-width="1"/>
  <text x="98" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#C5CEE0">$</text>

  <!-- Text -->
  <text x="70" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#84818A">No countries yet</text>
  <text x="70" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#ADAFB9">Your top earning country will</text>
  <text x="70" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#ADAFB9">appear here with transactions</text>
</svg>
