<svg width="140" height="130" viewBox="0 0 140 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="70" cy="42" r="34" fill="#F0F4FF"/>

  <!-- Coin stack base -->
  <ellipse cx="70" cy="55" rx="20" ry="6" fill="#E8EDFB"/>
  <ellipse cx="70" cy="50" rx="20" ry="6" fill="#F0F4FF" stroke="#D4DDEF" stroke-width="1.2"/>
  <ellipse cx="70" cy="45" rx="20" ry="6" fill="white" stroke="#D4DDEF" stroke-width="1.2"/>

  <!-- Dollar sign on top coin -->
  <text x="70" y="49" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#C5CEE0">$</text>

  <!-- Flat trend line -->
  <path d="M40 38 L55 38 L65 38 L75 38 L85 38 L100 38" stroke="#C5CEE0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Upward arrow hint -->
  <path d="M100 35 L106 27 L112 35" stroke="#3863FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <line x1="106" y1="27" x2="106" y2="42" stroke="#3863FF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Small decorative dots -->
  <circle cx="35" cy="30" r="2.5" fill="#E8EDFB"/>
  <circle cx="110" cy="55" r="3" fill="#E8EDFB"/>

  <!-- Text -->
  <text x="70" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#84818A">No earnings yet</text>
  <text x="70" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#ADAFB9">Earnings will appear here once</text>
  <text x="70" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#ADAFB9">you receive transactions</text>
</svg>
