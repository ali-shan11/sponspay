apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: production
    name: sponspay-api-prod
  name: sponspay-api-prod
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/backend-config: '{"default": "prod-sponspay-api-config"}'
  labels:
    app: sponspay-api
    environment: production
  name: sponspay-api-service
  namespace: sponspay-api-prod
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 3000
  selector:
    app: sponspay-api
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sponspay-api
    version: v1
  name: sponspay-api
  namespace: sponspay-api-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sponspay-api
  template:
    metadata:
      labels:
        app: sponspay-api
        environment: production
        version: v1
    spec:
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        - name: DB_NAME
          value: prod
        - name: API_KEY_ALLOWED_DOMAINS
          value: '["https://sponspay.com"]'
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: db-credentials
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db-credentials
        - name: DB_HOST
          value: 10.67.208.3
        - name: DB_SYNC
          value: "true"
        - name: SERVICE_ACCOUNT
          valueFrom:
            secretKeyRef:
              key: service-account
              name: google-account
        - name: SERVICE_ACCOUNT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              key: service-account-private-key
              name: google-account
        - name: SERVICE_ACCOUNT_USER
          valueFrom:
            secretKeyRef:
              key: service-account-user
              name: google-account
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              key: apikey
              name: sendgrid-api-key
        - name: FROM_EMAIL
          value: noreply@sponspay.com
        - name: CONTACT_US_EMAIL
          value: contactus@sponspay.com
        - name: FIREBASE_SERVICE_ACCOUNT
          valueFrom:
            secretKeyRef:
              key: account
              name: firebase-service-account
        - name: TIMEZONE_API_URL
          value: https://timeapi.io/
        - name: PHOTOS_BUCKET
          value: sponspay-dev-images
        - name: ZOHO_CLIENT_ID
          valueFrom:
            secretKeyRef:
              key: client_id
              name: zoho
        - name: ZOHO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: client_secret
              name: zoho
        - name: ZOHO_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              key: refresh_token
              name: zoho
        - name: ZOHO_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              key: redirect_uri
              name: zoho
        - name: PORT
          value: "3000"
        image: us-east1-docker.pkg.dev/sponspay-deployment/sponspay-dev/api:prod-latest
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        name: api
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
      securityContext:
        fsGroup: 1000
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: sponspay-api-config
  namespace: sponspay-api-prod
spec:
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 10
    healthyThreshold: 1
    port: 3000
    requestPath: /health
    timeoutSec: 5
    type: HTTP
    unhealthyThreshold: 3
  timeoutSec: 30
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  labels:
    environment: production
  name: prod-sponspay-api-cert
  namespace: sponspay-api-prod
spec:
  domains:
  - api.sponspay.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.allow-http: "false"
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: prod-sponspay-api-ip
    networking.gke.io/managed-certificates: prod-sponspay-api-cert
  labels:
    environment: production
  name: prod-sponspay-api-ingress
  namespace: sponspay-api-prod
spec:
  defaultBackend:
    service:
      name: sponspay-api-service
      port:
        number: 80
