apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sponspay-api-prod

namespace: sponspay-api-prod

resources:
- ../../base
- namespace.yaml
- ingress.yaml
- managedcertificate.yaml

patches:
- path: deployment-patch.yaml
- path: service-patch.yaml

images:
- name: us-east1-docker.pkg.dev/sponspay-deployment/sponspay-dev/api
  newTag: prod-latest
