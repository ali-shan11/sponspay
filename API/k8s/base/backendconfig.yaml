apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: sponspay-api-config
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: 3000
  # Increased timeout for WebSocket connections (Socket.IO)
  # WebSocket connections are long-lived and need extended timeouts
  timeoutSec: 3600
  # Session affinity is OPTIONAL with Redis adapter but RECOMMENDED for performance
  # Benefits:
  # - Reduces Redis pub/sub traffic (same-pod events don't need Redis)
  # - Lower latency for events on the same pod
  # - Still allows multi-pod scaling (clients can reconnect to any pod)
  sessionAffinity:
    affinityType: "CLIENT_IP"
    affinityCookieTtlSec: 3600
  # Connection draining timeout increased to match WebSocket timeout
  connectionDraining:
    drainingTimeoutSec: 3600
