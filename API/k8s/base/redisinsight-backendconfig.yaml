apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: redisinsight-backendconfig
  labels:
    app: redisinsight
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /api/health
    port: 5540
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
  iap:
    enabled: true
    oauthclientCredentials:
      secretName: oauth-client-secret
